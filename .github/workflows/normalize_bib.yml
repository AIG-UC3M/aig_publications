name: Normalizar Autores en BIB

on:
  push:
    branches:
      - main
    paths:
      - '**.bib'
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos normalizaciones se ejecuten simultáneamente.
concurrency:
  group: normalizar-bib
  cancel-in-progress: false

jobs:
  normalize-bib:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script en todos los archivos .bib
        run: |
          for file in *.bib; do
            if [ -f "$file" ]; then
              echo "Procesando $file..."
              python normalize_bib.py "$file" "$file"
            fi
          done

      - name: Guardar y sobreescribir en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.bib

          if git diff --cached --quiet; then
            echo "No se detectaron cambios en los autores."
          else
            git commit -m "auto: normalización estricta de autores en archivos .bib"

            git pull --rebase origin main

            git push origin main
          fi
